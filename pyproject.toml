[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brain-llm"
version = "0.2.0"
description = "🧠 Brain — CLI-first knowledge base & second brain for LLMs (Obsidian-style Markdown, wikilinks, full-text search, and MCP server)"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
keywords = ["obsidian", "cli", "markdown", "second-brain", "mcp", "llm", "knowledge-base", "notes"]

[project.scripts]
brain = "brain.cli:main"

[tool.setuptools]
packages = ["brain"]
